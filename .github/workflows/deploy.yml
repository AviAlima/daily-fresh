name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Type-check and unit tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Publish site to gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR"
          cp index.html styles.css manifest.json "$SITE_DIR/"
          cp -r dist icons vendor "$SITE_DIR/"
          touch "$SITE_DIR/.nojekyll"
          cd "$SITE_DIR"
          git init -q
          git symbolic-ref HEAD refs/heads/gh-pages
          git add -A
          git -c user.name="Avi Alima" -c user.email="avi.alima@gmail.com" commit -q -m "Deploy: $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/$GITHUB_REPOSITORY.git" HEAD:gh-pages
