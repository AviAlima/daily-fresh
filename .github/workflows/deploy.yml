name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Type-check and unit tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Stage site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html styles.css manifest.json "$RUNNER_TEMP/site/"
          cp -r dist icons vendor "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ runner.temp }}/site"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4